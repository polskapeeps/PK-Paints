name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install (Node)
        run: |
          if [ -f package.json ]; then
            npm ci
          fi

      - name: Lint/Typecheck (Node)
        run: |
          npm run lint --if-present
          npm run typecheck --if-present

      - name: Test (Node)
        run: |
          npm test --if-present

      - name: Production build and site checks (Node)
        run: npm run build

      - name: Cloudflare runtime integration checks
        run: npm run test:cloudflare

      - name: Cloudflare preview deployment dry run
        run: npx wrangler deploy --env preview --dry-run --outdir .wrangler/dry-run

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Security & Secrets
        run: |
          npx -y @aquasecurity/trivy fs --exit-code 1 --severity HIGH,CRITICAL . || true
          npx -y gitleaks detect --no-banner || true
